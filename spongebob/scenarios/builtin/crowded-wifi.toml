[scenario]
name = "Crowded Wi-Fi Evening"
description = "Shared wireless router during peak evening hours with heavy jitter and mild loss."

[flow]
packets = 120
interval_ms = 10.0
size_bytes = 64
seed = 19

[[hop]]
name = "client"
delay_ms = 4.0
jitter_ms = 1.0
loss_pct = 0.0

[[hop]]
name = "router"
delay_ms = 80.0
jitter_ms = 70.0
loss_pct = 2.0

[[hop]]
name = "isp"
delay_ms = 15.0
jitter_ms = 3.0
loss_pct = 0.0

[[hop]]
name = "server"
delay_ms = 5.0
jitter_ms = 1.0
loss_pct = 0.0
