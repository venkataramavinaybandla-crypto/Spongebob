[scenario]
name = "Flaky Last Mile"
description = "Degraded access drop between subscriber and gateway causing steady random packet loss."

[flow]
packets = 120
interval_ms = 10.0
size_bytes = 64
seed = 11

[[hop]]
name = "client"
delay_ms = 5.0
jitter_ms = 1.0
loss_pct = 8.0

[[hop]]
name = "router"
delay_ms = 10.0
jitter_ms = 1.0
loss_pct = 0.0

[[hop]]
name = "isp"
delay_ms = 15.0
jitter_ms = 2.0
loss_pct = 0.0

[[hop]]
name = "server"
delay_ms = 5.0
jitter_ms = 1.0
loss_pct = 0.0
