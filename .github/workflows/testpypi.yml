name: Publish to TestPyPI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and twine
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions with twine
        run: twine check dist/*
      - name: Verify no private files in distributions
        run: |
          python - <<'EOF'
          import pathlib, tarfile, zipfile

          forbidden = (
              "agents.md",
              "architecture.json",
              "memory.md",
              "context.md",
              "workflows.md",
              "persona_maaaaa.txt",
              "Pre-requirements",
          )
          dist = pathlib.Path("dist")
          for item in dist.iterdir():
              if item.suffix == ".whl":
                  with zipfile.ZipFile(item) as zf:
                      names = zf.namelist()
              elif item.name.endswith(".tar.gz"):
                  with tarfile.open(item, "r:gz") as tf:
                      names = tf.getnames()
              else:
                  continue
              for name in names:
                  for bad in forbidden:
                      if bad in name:
                          raise SystemExit(f"Forbidden entry {name!r} in {item.name}")
          print("Distribution privacy check passed.")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/spongebob-cli
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
